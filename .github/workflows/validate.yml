name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n scripts/setup.sh
          sh -n nginx/entrypoint.sh
          ./scripts/setup.sh --help >/dev/null

      - name: Validate Dockerfiles
        run: |
          docker build --check -f Dockerfile .
          docker build --check -f nginx/Dockerfile .

      - name: Build dsh image
        run: docker build --build-arg DSH_ALLOW_REMOTE_PRIVILEGED=true -t dsh-aio:ci -f Dockerfile .

      - name: Build Nginx image
        run: docker build -t dsh-aio-nginx:ci -f nginx/Dockerfile .

      - name: Smoke-test dsh image
        run: docker run --rm dsh-aio:ci dsh web --help >/dev/null

      - name: Smoke-test generated IP certificate
        run: |
          cert_dir="$(mktemp -d)"
          auth_hash="$(printf '%s\n' ci-test-password | openssl passwd -apr1 -stdin)"
          docker run --rm \
            -e NGINX_SELF_SIGNED_CERT=true \
            -e NGINX_CERT_DAYS=365 \
            -e NGINX_SERVER_NAME=203.0.113.10 \
            -e NGINX_BASIC_AUTH_USER=ci \
            -e NGINX_BASIC_AUTH_HASH="$auth_hash" \
            -e NGINX_IP_ALLOWLIST_ENABLED=false \
            -v "$cert_dir:/etc/nginx/certs" \
            dsh-aio-nginx:ci nginx -t
          san="$(openssl x509 -in "$cert_dir/server.crt" -noout -ext subjectAltName)"
          case "$san" in
            *'IP Address:203.0.113.10'*) ;;
            *) printf '%s\n' 'IP SAN missing from generated certificate' >&2; exit 1 ;;
          esac

      - name: Smoke-test generated DNS certificate
        run: |
          cert_dir="$(mktemp -d)"
          auth_hash="$(printf '%s\n' ci-test-password | openssl passwd -apr1 -stdin)"
          docker run --rm \
            -e NGINX_SELF_SIGNED_CERT=true \
            -e NGINX_CERT_DAYS=365 \
            -e NGINX_SERVER_NAME=example.test \
            -e NGINX_BASIC_AUTH_USER=ci \
            -e NGINX_BASIC_AUTH_HASH="$auth_hash" \
            -e NGINX_IP_ALLOWLIST_ENABLED=false \
            -v "$cert_dir:/etc/nginx/certs" \
            dsh-aio-nginx:ci nginx -t
          san="$(openssl x509 -in "$cert_dir/server.crt" -noout -ext subjectAltName)"
          case "$san" in
            *'DNS:example.test'*) ;;
            *) printf '%s\n' 'DNS SAN missing from generated certificate' >&2; exit 1 ;;
          esac

      - name: Validate Compose configuration
        env:
          DSH_TRUSTED_HOST: example.test:3080
          DSH_ALLOW_REMOTE_PRIVILEGED: "true"
          NGINX_SELF_SIGNED_CERT: "true"
          NGINX_CERT_DAYS: "365"
          NGINX_SERVER_NAME: example.test
          NGINX_BASIC_AUTH_USER: ci
          NGINX_BASIC_AUTH_HASH: ci-placeholder
          NGINX_IP_ALLOWLIST_ENABLED: "false"
          NGINX_IP_ALLOWLIST: ""
        run: docker compose config --quiet

      - name: Remove CI images
        if: always()
        run: docker image rm dsh-aio:ci dsh-aio-nginx:ci || true
